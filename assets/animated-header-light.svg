<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="auto" font-family="'JetBrains Mono','Fira Code',monospace">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#0F766E"><animate attributeName="stop-color" values="#0F766E;#1E40AF;#7C3AED;#0F766E" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#1E40AF"><animate attributeName="stop-color" values="#1E40AF;#7C3AED;#BE185D;#1E40AF" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#BE185D;#0F766E;#7C3AED" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>

    <linearGradient id="killChain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.35"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="hex" width="28" height="32.3" patternUnits="userSpaceOnUse">
      <path d="M14 0 L28 8 L28 24 L14 32 L0 24 L0 8 Z" fill="none" stroke="#1E40AF" stroke-width="0.4" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="900" height="260" fill="#f8fafc" rx="14"/>
  <rect width="900" height="260" fill="url(#hex)" rx="14"/>
  <rect width="900" height="260" fill="url(#vignette)" rx="14"/>

  <g font-family="monospace" font-size="11" fill="#0F766E" opacity="0.45">
    <text x="40"  y="-10">01<animate attributeName="y" from="-10" to="270" dur="6s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.55;0" dur="6s"  repeatCount="indefinite"/></text>
    <text x="110" y="-10">10<animate attributeName="y" from="-10" to="270" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="7.5s" repeatCount="indefinite"/></text>
    <text x="820" y="-10">11<animate attributeName="y" from="-10" to="270" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.55;0" dur="5.5s" repeatCount="indefinite"/></text>
    <text x="870" y="-10">00<animate attributeName="y" from="-10" to="270" dur="8s"   repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="8s"  repeatCount="indefinite"/></text>
    <text x="60"  y="-10">$<animate attributeName="y" from="-10" to="270" dur="9s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0" dur="9s"  repeatCount="indefinite"/></text>
  </g>

  <rect x="-150" y="0" width="150" height="260" fill="url(#titleGrad)" opacity="0.05">
    <animate attributeName="x" from="-150" to="900" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#cbd5e1" stroke-width="1" fill="none">
    <line x1="60"  y1="200" x2="170" y2="150"/>
    <line x1="170" y1="150" x2="290" y2="210"/>
    <line x1="290" y1="210" x2="430" y2="170"/>
    <line x1="430" y1="170" x2="570" y2="220"/>
    <line x1="570" y1="220" x2="700" y2="160"/>
    <line x1="700" y1="160" x2="830" y2="210"/>
    <line x1="170" y1="150" x2="290" y2="60"/>
    <line x1="430" y1="170" x2="560" y2="70"/>
    <line x1="700" y1="160" x2="760" y2="80"/>
  </g>

  <g stroke="url(#killChain)" stroke-width="2" fill="none" filter="url(#glow)">
    <path d="M60 200 L170 150" stroke-dasharray="160" stroke-dashoffset="160">
      <animate attributeName="stroke-dashoffset" values="160;0;0;160" keyTimes="0;0.2;0.9;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M170 150 L290 210" stroke-dasharray="160" stroke-dashoffset="160">
      <animate attributeName="stroke-dashoffset" values="160;160;0;0;160" keyTimes="0;0.2;0.4;0.9;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M290 210 L430 170" stroke-dasharray="160" stroke-dashoffset="160">
      <animate attributeName="stroke-dashoffset" values="160;160;0;0;160" keyTimes="0;0.4;0.6;0.9;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M430 170 L570 220" stroke-dasharray="160" stroke-dashoffset="160">
      <animate attributeName="stroke-dashoffset" values="160;160;0;0;160" keyTimes="0;0.6;0.8;0.9;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M570 220 L700 160" stroke-dasharray="160" stroke-dashoffset="160">
      <animate attributeName="stroke-dashoffset" values="160;160;0;0;160" keyTimes="0;0.8;0.95;0.96;1" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-size="9" fill="#475569">
    <g transform="translate(60 200)"><circle r="7" fill="#ffffff" stroke="#DC2626" stroke-width="1.8"><animate attributeName="r" values="7;9;7" dur="1.4s" repeatCount="indefinite"/></circle><text x="-18" y="22">phish.eml</text></g>
    <g transform="translate(170 150)"><circle r="6" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/><text x="-18" y="-12">winword</text></g>
    <g transform="translate(290 210)"><circle r="6" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/><text x="-18" y="20">powershell</text></g>
    <g transform="translate(430 170)"><circle r="6" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/><text x="-12" y="-12">lsass</text></g>
    <g transform="translate(570 220)"><circle r="6" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/><text x="-12" y="20">smb://dc</text></g>
    <g transform="translate(700 160)"><circle r="7" fill="#ffffff" stroke="#0F766E" stroke-width="1.8"><animate attributeName="r" values="7;10;7" dur="1.6s" repeatCount="indefinite"/></circle><text x="-12" y="-12">DETECT ✓</text></g>
    <g transform="translate(290 60)"><circle r="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/></g>
    <g transform="translate(560 70)"><circle r="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/></g>
    <g transform="translate(760 80)"><circle r="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/></g>
    <g transform="translate(830 210)"><circle r="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/></g>
  </g>

  <text x="40" y="50" font-size="13" fill="#0F766E">┌─[</text>
  <text x="62" y="50" font-size="13" fill="#1E40AF">ahmed@phd</text>
  <text x="128" y="50" font-size="13" fill="#0F766E">]─[</text>
  <text x="146" y="50" font-size="13" fill="#D97706">~/research/apt-detection</text>
  <text x="306" y="50" font-size="13" fill="#0F766E">]</text>
  <text x="40" y="68" font-size="13" fill="#0F766E">└─$</text>
  <text x="72" y="68" font-size="13" fill="#1f2937">./hunt --target apts --using ai</text>
  <text x="318" y="68" font-size="13" fill="#0F766E">▍<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></text>

  <text x="450" y="125" text-anchor="middle" font-size="46" font-weight="900" fill="url(#titleGrad)" filter="url(#softGlow)" letter-spacing="2">
    AHMED  BARGADY
  </text>
  <text x="448" y="125" text-anchor="middle" font-size="46" font-weight="900" fill="#DC2626" opacity="0.15" letter-spacing="2">
    AHMED  BARGADY
    <animate attributeName="opacity" values="0;0.2;0;0.12;0" dur="3.5s" repeatCount="indefinite"/>
  </text>
  <text x="452" y="125" text-anchor="middle" font-size="46" font-weight="900" fill="#1E40AF" opacity="0.15" letter-spacing="2">
    AHMED  BARGADY
    <animate attributeName="opacity" values="0;0.18;0;0.1;0" dur="3.5s" begin="0.15s" repeatCount="indefinite"/>
  </text>

  <line x1="220" y1="146" x2="680" y2="146" stroke="url(#titleGrad)" stroke-width="1.2" opacity="0.7"/>
  <text x="450" y="166" text-anchor="middle" font-size="14" fill="#1f2937" letter-spacing="3">
    PhD  RESEARCHER  ·  AI  for  APT  DETECTION
  </text>

  <g font-size="10">
    <rect x="305" y="180" width="80" height="20" rx="10" fill="#0F766E22" stroke="#0F766E" stroke-width="0.8"/>
    <circle cx="318" cy="190" r="3" fill="#0F766E"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="327" y="194" fill="#0F766E">ACTIVE</text>

    <rect x="395" y="180" width="100" height="20" rx="10" fill="#1E40AF22" stroke="#1E40AF" stroke-width="0.8"/>
    <text x="403" y="194" fill="#1E40AF">⚡ ML PIPELINES</text>

    <rect x="505" y="180" width="120" height="20" rx="10" fill="#BE185D22" stroke="#BE185D" stroke-width="0.8"/>
    <text x="513" y="194" fill="#BE185D">▲ THREAT HUNTING</text>
  </g>

  <g stroke="#cbd5e1" stroke-width="1.4" fill="none">
    <polyline points="14,28 14,14 28,14"/>
    <polyline points="886,232 886,246 872,246"/>
    <polyline points="886,28 886,14 872,14"/>
    <polyline points="14,232 14,246 28,246"/>
  </g>

  <g font-size="10" fill="#475569" opacity="0.8">
    <text x="40" y="240">[ TELEMETRY ]</text>
    <text x="130" y="240" fill="#0F766E">events: 1.2M/s</text>
    <text x="240" y="240" fill="#1E40AF">graphs: 87</text>
    <text x="320" y="240" fill="#D97706">anomalies: 14</text>
    <text x="430" y="240" fill="#BE185D">apts: 1 (tracking)</text>
    <text x="730" y="240">build: stable ▌</text>
  </g>
</svg>
