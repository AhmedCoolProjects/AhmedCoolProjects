<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#f72585;#7209b7;#3a0ca3;#4361ee;#4cc9f0;#00f5d4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#f72585">
        <animate attributeName="stop-color" values="#f72585;#7209b7;#3a0ca3;#4361ee;#4cc9f0;#00f5d4;#f72585" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7209b7">
        <animate attributeName="stop-color" values="#7209b7;#3a0ca3;#4361ee;#4cc9f0;#00f5d4;#f72585;#7209b7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#4361ee">
        <animate attributeName="stop-color" values="#4361ee;#4cc9f0;#00f5d4;#f72585;#7209b7;#3a0ca3;#4361ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#f72585;#7209b7;#3a0ca3;#4361ee;#4cc9f0;#00f5d4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0d1117" rx="15"/>

  <!-- Animated grid lines -->
  <g opacity="0.05" stroke="#00f5d4" stroke-width="0.5">
    <line x1="0" y1="20" x2="800" y2="20"><animate attributeName="opacity" values="0.1;0.05;0.1" dur="4s" repeatCount="indefinite"/></line>
    <line x1="0" y1="40" x2="800" y2="40"><animate attributeName="opacity" values="0.05;0.1;0.05" dur="4s" repeatCount="indefinite"/></line>
    <line x1="0" y1="60" x2="800" y2="60"><animate attributeName="opacity" values="0.1;0.05;0.1" dur="3s" repeatCount="indefinite"/></line>
    <line x1="0" y1="80" x2="800" y2="80"><animate attributeName="opacity" values="0.05;0.1;0.05" dur="5s" repeatCount="indefinite"/></line>
    <line x1="0" y1="100" x2="800" y2="100"><animate attributeName="opacity" values="0.1;0.05;0.1" dur="3.5s" repeatCount="indefinite"/></line>
    <line x1="0" y1="120" x2="800" y2="120"><animate attributeName="opacity" values="0.05;0.1;0.05" dur="4.5s" repeatCount="indefinite"/></line>
    <line x1="0" y1="140" x2="800" y2="140"><animate attributeName="opacity" values="0.1;0.05;0.1" dur="3.2s" repeatCount="indefinite"/></line>
    <line x1="0" y1="160" x2="800" y2="160"><animate attributeName="opacity" values="0.05;0.1;0.05" dur="5.2s" repeatCount="indefinite"/></line>
    <line x1="0" y1="180" x2="800" y2="180"><animate attributeName="opacity" values="0.1;0.05;0.1" dur="4.8s" repeatCount="indefinite"/></line>
  </g>

  <!-- Floating particles -->
  <circle cx="100" cy="50" r="2" fill="#00f5d4" opacity="0.6">
    <animate attributeName="cy" values="50;30;50" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="150" r="1.5" fill="#f72585" opacity="0.5">
    <animate attributeName="cy" values="150;120;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="30" r="2" fill="#4cc9f0" opacity="0.7">
    <animate attributeName="cy" values="30;50;30" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="170" r="1.5" fill="#7209b7" opacity="0.5">
    <animate attributeName="cy" values="170;140;170" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="60" r="2" fill="#4361ee" opacity="0.6">
    <animate attributeName="cy" values="60;40;60" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="130" r="1.5" fill="#00f5d4" opacity="0.4">
    <animate attributeName="cy" values="130;100;130" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="120" r="1" fill="#f72585" opacity="0.6">
    <animate attributeName="cx" values="50;80;50" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="80" r="1.5" fill="#4cc9f0" opacity="0.5">
    <animate attributeName="cx" values="750;720;750" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="180" r="1" fill="#00f5d4" opacity="0.4">
    <animate attributeName="cy" values="180;160;180" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Twinkling stars -->
  <text x="150" y="80" fill="#ffffff" font-size="8" opacity="0.3">✦</text>
  <text x="650" y="140" fill="#ffffff" font-size="6" opacity="0.2">✦</text>
  <text x="80" y="170" fill="#ffffff" font-size="5" opacity="0.3">✦</text>
  <text x="730" y="40" fill="#ffffff" font-size="7" opacity="0.2">✦</text>
  <text x="300" y="180" fill="#ffffff" font-size="5" opacity="0.25">✦</text>
  <text x="550" y="35" fill="#ffffff" font-size="6" opacity="0.2">✦</text>

  <!-- Main title with gradient glow -->
  <text x="400" y="85" text-anchor="middle" font-family="'Segoe UI', 'Fira Code', monospace" font-size="42" font-weight="900" fill="url(#grad1)" filter="url(#glow)">
    AHMED BARGADY
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Decorative line -->
  <line x1="200" y1="105" x2="600" y2="105" stroke="url(#grad2)" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Subtitle -->
  <text x="400" y="135" text-anchor="middle" font-family="'Fira Code', monospace" font-size="16" fill="#8b949e" letter-spacing="6">
    Data Science Engineer
    <animate attributeName="letter-spacing" values="6;8;6" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle 2 -->
  <text x="400" y="160" text-anchor="middle" font-family="'Fira Code', monospace" font-size="13" fill="#4cc9f0" opacity="0.7" letter-spacing="4">
    AI • Cloud • Open Source
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- Terminal cursor blink -->
  <text x="405" y="135" text-anchor="start" font-family="monospace" font-size="16" fill="#00f5d4" opacity="0">
    _
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
  </text>

  <!-- Corner decorations -->
  <rect x="15" y="15" width="20" height="20" fill="none" stroke="#30363d" stroke-width="1.5" rx="3" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="765" y="165" width="20" height="20" fill="none" stroke="#30363d" stroke-width="1.5" rx="3" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- GitHub corner emoji -->
  <text x="30" y="30" font-size="14" opacity="0.6">🚀</text>
  <text x="756" y="183" font-size="14" opacity="0.6">💡</text>
</svg>
